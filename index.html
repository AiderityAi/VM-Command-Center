<script>
const D={"sections":[{"id":"s1","title":"1. Daily Operating Schedule","blocks":[{"t":"note","text":"Golden Rule: never approve a supplier simply because the form looks complete. Validate controls, retain evidence, document exceptions, get required approvals."},{"t":"h","text":"If a control fails"},{"t":"steps","items":["Stop the affected processing step.","Document the issue.","Request corrected documentation or information.","Escalate when required.","Resume only after the issue is resolved."]},{"t":"h","text":"Daily schedule"},{"t":"table","head":["Time","Required activity"],"rows":[["8:00 AM","Review Vendor Management Queue, Supplier Enablement Queue, VM Rush Queue, assigned emails"],["8:30 AM","Review assignment distribution and prioritize work"],["12:00 PM","Complete and submit morning assignments"],["3:00 PM","Complete morning approvals, S/4 keying, supervisor approvals, director review when required"],["Before EOD","Recheck VM Rush and complete daily closure"]]},{"t":"h","text":"Morning queue checklist"},{"t":"check","items":["Open Vendor Management Queue","Open Supplier Enablement Queue","Open VM Rush Queue","Review personal assigned emails","Identify urgent and time-sensitive requests","Identify banking changes and supplier approvals","Review outstanding corrections and audits","Record items requiring escalation"]},{"t":"h","text":"Work prioritization"},{"t":"steps","items":["VM Rush","Banking changes","Supplier approvals","Supplier updates","Reporting and projects"]},{"t":"h","text":"Queue coverage rotation"},{"t":"table","head":["Team member","Coverage"],"rows":[["Alona","7:30 AM–11:30 AM"],["Onna","11:30 AM–2:30 PM"],["Roopsika","2:30 PM–5:00 PM"]]},{"t":"h","text":"End-of-day closure"},{"t":"check","items":["All assigned forms completed or appropriately documented","VM Rush reviewed and completed","Team chat updated","Stalled items documented","Escalations submitted","Audit evidence attached","Outstanding work identified for follow-up"]}],"part":"Part A: Supplier Control Playbook (v5)"},{"id":"s2","title":"2. Classify the Request","blocks":[{"t":"table","head":["Request type","Processing path"],"rows":[["New Non-PO supplier","Non-PO workflow"],["New PO supplier","PO workflow"],["Supplier update","Maintenance workflow"],["Banking change","Banking validation"],["Tax change","TIN validation"],["Foreign supplier","W-8 workflow"],["Tax-exempt supplier","501(c)(3) workflow"],["Enablement issue","Ariba workflow"]]},{"t":"p","text":"Also identify: PO or Non-PO; tax exempt or taxable; domestic or foreign; onsite or offsite; ISN or Non-ISN. Classification determines the validation path and documentation required."},{"t":"h","text":"Initial document package: Non-PO"},{"t":"check","items":["Supplier form","W-9","EFT authorization form","Bank letter or voided check"]},{"t":"h","text":"Initial document package: PO"},{"t":"check","items":["Supplier registration","W-9 or W-8","Banking documentation","Insurance documentation","Safety documentation, if required","Procurement approval"]}]},{"id":"s3","title":"3. Required Validation Sequence","blocks":[{"t":"steps","items":["Tax validation","Banking validation","Code of Conduct","ESG questionnaire","Insurance review","Safety review","Business Partner validation","Supplier enablement","Audit documentation review","Approval"]},{"t":"note","text":"Do not bypass required validation steps."}]},{"id":"s4","title":"4. Tax Validation (W-9 and TINCheck)","blocks":[{"t":"h","text":"Step 1: Review the W-9"},{"t":"check","items":["Current IRS W-9 (check the revision date against irs.gov) currently using March 2024 version","Signed","Dated","Legal name on Line 1","DBA on Line 2, when applicable","Correct taxpayer identification type","Supplier classification supports the tax information"]},{"t":"h","text":"Step 2: Run TINCheck"},{"t":"p","text":"Enter exactly the W-9 Line 1 legal name and the tax identification number. Never substitute DBA, AKA, FKA, NKA, nicknames, or alternate business names."},{"t":"note","text":"Most common failure: incorrect legal name on Line 1, not an invalid tax ID."},{"t":"h","text":"Step 3: Respond to the result"},{"t":"table","head":["Finding","Required action"],"rows":[["Name/TIN mismatch","Request a new W-9"],["DBA entered on Line 1","Request corrected W-9"],["Disregarded entity issue","Owner name required"],["ITIN submitted","Escalate to AP Leadership"],["Unsigned W-9","Reject or return"]]},{"t":"note","text":"Do not approve a failed tax validation."},{"t":"h","text":"Tax-exempt supplier (501(c)(3))"},{"t":"steps","items":["TINCheck","GuideStar verification","Address validation","Banking validation","Documentation notes"]},{"t":"p","text":"Retain: GuideStar screenshot, address validation evidence, TINCheck result, W-9."},{"t":"h","text":"Foreign suppliers"},{"t":"p","text":"Use the W-8 workflow. For applicable international banking relationships use the IBAN validation process rather than starting with domestic AVS/Penny Test."},{"t":"h","text":"Canadian W-8BEN-E review"},{"t":"check","items":["Canada listed","CRA Business Number present","FATCA status complete","Treaty country = Canada","Limitation on Benefits (LOB) checked","Line 15 completed for services, when applicable","Signed and dated"]},{"t":"note","text":"Do not request a U.S. EIN solely because the supplier is Canadian. Treaty questions go to Tax/AP Leadership."}]},{"id":"s5","title":"5. Banking Validation","blocks":[{"t":"table","head":["Supplier type","Validation method","Profile"],"rows":[["Non-PO","AVS","Clearway01"],["PO","Penny Test","Clearway03"],["Failed Penny Test","Confidence/Challenge Test","Clearway02"]]},{"t":"note","text":"Do not use the wrong validation path."},{"t":"h","text":"A. Non-PO: AVS procedure"},{"t":"p","text":"Required: EFT Authorization Form; bank letter OR voided check; latest Ariba submission."},{"t":"steps","items":["Confirm all required banking documents are received","Compare the legal organization name","Confirm the routing number","Confirm the account number","Enter the legal organization name in Clearway01","Enter the exact routing and account numbers","Leave address fields blank","Execute AVS validation","Save a screenshot","Document the result"]},{"t":"p","text":"Decision: documentation matches submission → approve validation. Documentation differs → reject and request correction."},{"t":"h","text":"B. PO: Penny Test procedure"},{"t":"steps","items":["Open Clearway03","Enter the legal organization name","Enter the routing number","Enter the account number","Submit the Penny Test","Immediately capture the Request ID","Save the Request ID in the Tracking Log, Form Notes, and Audit Form","Monitor the test status","Save the screenshot and supporting evidence"]},{"t":"h","text":"Penny Test status response"},{"t":"table","head":["Status","Action"],"rows":[["Processing","Wait"],["Completed","Approve"],["Processing Error","Resubmit"],["Failed","Use Clearway02 Confidence/Challenge Test"]]},{"t":"h","text":"Callback procedure"},{"t":"p","text":"Use only when the Penny Test is delayed and the supplier is business-critical."},{"t":"steps","items":["Contact Treasury or Accounting","Verify the routing number","Verify the account number","Obtain a confirmation email","Attach the evidence to SAP"]},{"t":"note","text":"The Penny Test must still be completed later."},{"t":"h","text":"Fraud prevention: immediate escalation to Supervisor and Director"},{"t":"list","items":["Banking changes from Gmail or Yahoo accounts","Spoofed email indicators","Returned deposits","Supplier refusal to complete callback","Supplier inability to verify deposits twice"]},{"t":"note","text":"Do not independently dismiss suspected banking fraud."}]},{"id":"s6","title":"6. Code of Conduct and ESG","blocks":[{"t":"check","items":["Code of Conduct acceptance reviewed","ESG questionnaire reviewed","Evidence retained","Missing or incomplete items documented and followed up"]},{"t":"p","text":"The v5 playbook names these as required review controls but gives no detailed scoring criteria or separate ESG approval matrix."}]},{"id":"s7","title":"7. Insurance Review","blocks":[{"t":"h","text":"ISN supplier"},{"t":"p","text":"Insurance syncs automatically, but analyst review is still required."},{"t":"check","items":["Insurance approved","Sync complete","No open issues"]},{"t":"h","text":"Non-ISN supplier"},{"t":"p","text":"Required: Modular Insurance Questionnaire, Certificate of Insurance (COI), risk review."},{"t":"check","items":["General Liability (GL)","Auto coverage","Workers Compensation","Coverage limits","Expiration dates","Additional Insured status","Services covered"]},{"t":"table","head":["Finding","Action"],"rows":[["No insurance","Hold"],["Expired insurance","Hold"],["Missing Additional Insured","Return"],["Insufficient coverage","Return"],["Insurance exception","Escalate to Risk Team"]]}]},{"id":"s8","title":"8. Safety Compliance","blocks":[{"t":"p","text":"Required for onsite suppliers and suppliers with more than 10 employees. Non-ISN: Safety Questionnaire, OSHA logs (3 years), EMR/EMDR records (3 years). ISN: auto-synced; confirm status."},{"t":"check","items":["Onsite/offsite status identified","Employee count considered","OSHA logs reviewed, when required","EMR/EMDR reviewed, when required","Safety questionnaire reviewed","Safety approval confirmed","Evidence retained"]},{"t":"note","text":"Escalate high incident rates, missing OSHA logs, or safety concerns to EHS."}]},{"id":"s9","title":"9. Business Partner (BP) Review and Manual Creation","blocks":[{"t":"p","text":"Use manual BP creation when ECC supplier migration to S/4 fails. Source of truth: 1) ECC, 2) Coupa. Do not add or change supplier information without approved documentation."},{"t":"h","text":"Review ECC"},{"t":"check","items":["Vendor number","Tax ID","Banking","Contacts"]},{"t":"h","text":"Review Coupa"},{"t":"check","items":["Payment terms","Insurance","Incoterms","Supplier type"]},{"t":"h","text":"S/4 setup controls"},{"t":"check","items":["Create Business Partner","Extend company code 3505","Add applicable purchasing organizations (1000, 2000, 3000, 4000, 5000, 6000)","Currency = USD","Incoterms required","Address Valid From = 01/01/1900","FI role present (FLVN00)","Purchasing role present (FLVN01 for PO suppliers)","Correct supplier type","Save and confirm no errors"]},{"t":"note","text":"The 01/01/1900 Valid From date is a frequent cause of Ariba synchronization failure."}]},{"id":"s10","title":"10. Ariba Supplier Enablement","blocks":[{"t":"check","items":["Correct ANID","TRR sent","TRR accepted","PO task assigned","Invoice task assigned","Supplier role assigned"]},{"t":"h","text":"Supplier says “I can’t see my PO”: check in order"},{"t":"steps","items":["Confirm TRR accepted","Confirm tasks assigned","Confirm supplier roles assigned","Change date filter to 365 days"]},{"t":"table","head":["Problem","Action / escalation"],"rows":[["ANID conflict","Enablement Team"],["Integration failure","Cognitus"],["Missing tasks","Assign required tasks"],["PO not visible","TRR, tasks, roles, 365-day filter"],["Valid From date issue","Review BP setup"]]}]},{"id":"s11","title":"11. Final Approval Checklist","blocks":[{"t":"check","items":["Tax validation passed","Banking validation passed","Code of Conduct reviewed","ESG questionnaire reviewed","Insurance passed","Safety passed, when required","BP created or updated","Correct company code","Purchasing organization validated","ANID linked","TRR accepted","Invoice tasks assigned","PO tasks assigned, when applicable","Documentation attached","Notes completed","Screenshots attached","Required approvals completed"]},{"t":"note","text":"Ask yourself: “Do I have enough documentation to defend this approval during a SOX audit?” If not, stop and obtain the missing evidence."}]},{"id":"s12","title":"12. SAP Reports and T-Codes","blocks":[{"t":"table","head":["Report / T-code","Purpose","Frequency"],"rows":[["ME5A","Purchase requisitions: validate demand, research requesters","Every morning"],["ME2N","Purchase orders: PO activity, open POs, history","Daily"],["ME3M","Contracts: contract dates, procurement validation","As needed"],["ZMM_PROC_LIFECYCLE","P2P lifecycle: request, requisition, PO, invoice","Daily"],["ZMMAQ_VOPEN","Open POs: disputes, missing invoice claims","Daily"],["ZMPLANTBL","Inventory research","As needed"],["ZDMPN","Manufacturer parts","As needed"]]},{"t":"p","text":"Morning routine: ME5A, ME2N, ZMM_PROC_LIFECYCLE, ZMMAQ_VOPEN. To run: open SAP Launchpad, search the report, apply filters, execute, export, save a Variant when appropriate. Exact filter values and variants are not specified in v5; confirm with your supervisor."}]},{"id":"s13","title":"13. Escalation Matrix","blocks":[{"t":"table","head":["Issue","Escalate to"],"rows":[["ITIN","AP Leadership"],["Treaty questions","Tax/AP Leadership"],["Failed Challenge Test","Supervisor + Director"],["Fraud concern","Supervisor + Director"],["Integration failure","Cognitus"],["Duplicate BP","Supervisor"],["ANID conflict","Enablement Team"],["Legal exception","Legal Team"],["Safety concern","EHS"],["Insurance exception","Risk Team"]]},{"t":"p","text":"Always include: supplier name, request type, issue, action already taken, supporting evidence, and the decision or assistance needed."}]},{"id":"s15","title":"14. Daily Work Tracker (suggested fields)","blocks":[{"t":"p","text":"Suggested, not mandatory per v5: Date received · Supplier name · Supplier ID/BP · Request type · Assigned analyst · Priority · Tax status · Banking method · Banking status · Penny Test Request ID · Code of Conduct · ESG · Insurance · Safety · BP status · Ariba status · Outstanding item · Escalation owner · Last follow-up · Evidence complete · Approval status · Closure date."},{"t":"h","text":"Efficiency practices"},{"t":"list","items":["Classify the request immediately to avoid rework","Review all submitted documents together before validating","Use the correct banking profile for PO vs Non-PO","Capture the Penny Test Request ID immediately","Record issues and missing documents as soon as identified","Use the email templates","Run daily reports consistently","Attach evidence as each validation completes","Escalate control failures promptly","Review VM Rush again before signoff"]},{"t":"h","text":"Confirm with leadership before treating as standard"},{"t":"list","items":["SLA targets per request type","SAP report filter values and variants","Email distribution lists and recipients","Screen-by-screen BP creation navigation","Insurance coverage thresholds","Detailed ESG acceptance criteria","Complete Ariba integration troubleshooting sequence"]},{"t":"note","text":"Do not invent these values or substitute informal practices for approved procedures."}]},{"id":"b1","part":"Part B: Daily Dashboard Execution (Dashboard SOP v1.1)","title":"B1. Production Goal & Dashboard Readiness","blocks":[{"t":"note","text":"Goal: 3 completed registrations per analyst per business day (15 per week). Success formula: Pending Approval → Pending Resubmit → In Registration → Invited."},{"t":"h","text":"What counts as a completion"},{"t":"list","items":["Supplier was open in a prior dashboard snapshot and is registered in the next snapshot","Uploads before noon Arizona time count toward the previous business day","Saturday and Sunday do not count"]},{"t":"h","text":"Roles"},{"t":"table","head":["Role","Accountability"],"rows":[["Daily Dashboard Owner (rotating analyst)","Runs the three Ariba reports, uploads, validates, shares, confirms readiness in team chat"],["Assigned VM Analyst","Owns assigned suppliers: follow-ups, comments, ServiceNow, approvals, completions, EOD review"],["Backup VM Analyst","Covers Dashboard Owner duties or an absent analyst"],["VM Lead (Alicia Ellis)","Process and dashboard support, data-quality questions, corrections"],["VM Leadership (Chantel Miller)","Governance and escalation: aging, cross-functional blockers, productivity risk"],["IT / ServiceNow Support","Technical fix once a valid ticket has supplier, BP and error details"]]},{"t":"note","text":"Ownership principle: a blocked supplier stays with the assigned analyst until resolved, even when the next action sits with the supplier, requester, Safety, ISNet or IT."},{"t":"h","text":"Three required reports (all 3 before the dashboard is “ready”)"},{"t":"table","head":["#","Report","Contents"],"rows":[["1","Supplier Registration Report","Status, owner, registration dates"],["2","Registration Questionnaire Response Report","Answers, contacts, ISNet responses, scope"],["3","Insurance & Safety / SM Modular Questionnaire / COI & SAFETY REPORT","COI and Safety status, pending updates"]]},{"t":"rep3"},{"t":"p","text":"Do not substitute the Questionnaire Answers export for the Insurance & Safety / SM Modular Questionnaire / COI & SAFETY REPORT. Run the Insurance & Safety / SM Modular Questionnaire / COI & SAFETY REPORT for the full population, not filtered to your own name."},{"t":"h","text":"Morning load (Dashboard Owner only; one person uploads)"},{"t":"steps","items":["Create a dated folder (YYYY-MM-DD) for all three exports","Run and export the three reports from Ariba","Save as YYYY-MM-DD_Registration_Report, _Questionnaire_Answers, _Insurance_Safety","Open the published contributor dashboard and upload all three files","Verify 3 of 3 files recognized and date, population and owner views are current","Share refreshed data with the team","Post confirmation in team chat","Refresh Non-PO and Supplier Update SharePoint sections as needed"]},{"t":"p","text":"Chat confirmation: “VM Daily Dashboard refreshed. All 3 reports are loaded and today’s data has been shared. The team can begin working from the current dashboard.” If it is not posted, contact the Dashboard Owner and do not use stale data."},{"t":"h","text":"If validation fails"},{"t":"steps","items":["Do not announce the dashboard as ready","Recheck the three files and their report roles","Confirm required columns and expected population","Retry the upload once","If it still fails, notify the VM Lead and document what failed","Keep working from validated source records; backfill comments once restored"]},{"t":"h","text":"Analyst start of day (after refresh is confirmed)"},{"t":"check","items":["Open your dashboard tab and confirm your population is complete","Review Closest to Completion first","Review aged suppliers, outstanding actions, internal approvals, ServiceNow items, follow-up history","Review the VM Rush Queue","Identify 3 completion targets for today"]},{"t":"note","text":"Never select Clear Data. This applies to all dashboard users, always."}]},{"id":"b2","title":"B2. Status Priority & Completion Strategy","blocks":[{"t":"table","head":["Priority","Status","Meaning / action"],"rows":[["1","Pending Approval","Ready for VM review: prioritize completion"],["2","Pending Resubmit","Supplier correction needed: supplier outreach"],["3","In Registration","Supplier working: identify missing requirements"],["4","Invited","Registration sent: follow up"]]},{"t":"p","text":"For each Pending Approval supplier ask: “What single thing is preventing approval?” Typical blockers: banking validation, missing COI, missing Safety, missing ISNet ID, missing Scope. Remove the blocker immediately; this is your fastest completion."}]},{"id":"b3","title":"B3. ISNet-First Supplier Review Order","blocks":[{"t":"table","head":["Step","Check"],"rows":[["1. ISNet","Did the supplier answer YES? Verify Company ID and membership; verify insurance and safety in ISNet. The dashboard shows COI and Safety as “Covered by ISNet”, but still work the Ariba questionnaires. YES but no Company ID: send the ISNet follow-up first, before any insurance or safety review. This is the immediate blocker."],["2. Tax","US: W-9 received, signed, dated, TINCheck passed. Foreign: W-8 received, treaty and FATCA complete, signed, dated."],["3. Banking","Non-PO: AVS (Clearway01). PO: Penny Test (Clearway03) with Request ID saved. Failed: Challenge Test (Clearway02) and callback completed."],["4. Insurance (COI)","COI present, coverage active, expiration valid, Additional Insured met. Still worked in Ariba for ISNet members."],["5. Safety","Safety documentation, OSHA documents, questionnaire, internal approval. Still worked in Ariba for ISNet members."],["6. Registration","Scope completed, internal approvals obtained, documentation complete."],["7. Final approval","All items below, then approve."]]},{"t":"check","items":["Tax complete","Banking complete","Insurance complete","Safety complete","Scope complete","Comments updated","Worked status checked","Approval complete"]},{"t":"note","text":"No Scope = No Approval. No final approval while Scope is blank. ISNet is the compliance source of truth, and the Ariba COI and Safety questionnaires are still worked."},{"t":"p","text":"How this fits Part A: the dashboard order is a triage order. The full v5 control sequence (Code of Conduct, ESG, Business Partner, Ariba enablement, audit review) still applies before final approval. When a supplier answers YES to ISNetWorld, ISNet is the source of truth for insurance and safety compliance: verify Company ID, active membership, valid insurance, safety compliance and no open compliance issues in ISNet. Ariba COI and Safety statuses show as Covered by ISNet, but the Ariba questionnaires are still worked as well. Part A’s note about confirming ISN sync status is part of that verification."}]},{"id":"b4","title":"B4. Supplier Work Standard & Comments","blocks":[{"t":"p","text":"Every supplier you work needs:"},{"t":"check","items":["Worked status updated","Meaningful comment added","Blocker identified","Next owner identified","Next action identified","Follow-up date set"]},{"t":"p","text":"Every comment answers: What happened? Where does the supplier stand? What is outstanding? Who owns the next action? What happens next?"},{"t":"p","text":"Acceptable: “Follow-up sent to supplier for corrected COI. Safety is approved. Waiting on supplier resubmission before VM can proceed. Analyst will review upon receipt.”"},{"t":"p","text":"Not acceptable: “Pending,” “Waiting,” “Followed up.”"},{"t":"code","title":"Comment template (use every time)","lines":["Current Status: [Invited / In Registration / Pending Resubmit / Pending Approval]","Completed: [items completed]","Outstanding: [open items]","Current Blocker: [specific blocker]","Next Owner: [Supplier / VM / Requester / IT / Safety]","Next Action: [specific action]","Follow-Up Date: [date]","Completion Risk: [Yes / No]"]}]},{"id":"b5","title":"B5. ServiceNow, Follow-Up & Escalation","blocks":[{"t":"h","text":"Create a ticket only for"},{"t":"list","items":["System issue","Integration issue","Ariba failure","S/4 failure","Data defect"]},{"t":"h","text":"Process"},{"t":"steps","items":["Confirm it is system-related and cannot be fixed through normal processing","Capture supplier name, BP number, company code (if applicable), process step, error, business impact","Create or identify the ticket; record the number in the dashboard comment and what it blocks","Monitor until resolved and complete any retesting","Escalate aging tickets through the VM Lead"]},{"t":"h","text":"Follow-up rules"},{"t":"list","items":["Check Outlook history before escalating; do not rely on dashboard email counts","At the follow-up threshold with no supplier action, escalate to the requester or business contact; do not keep repeating reminders","Document escalation date, recipient, reason, and next follow-up date"]},{"t":"table","head":["Escalation path","Use for"],"rows":[["Analyst","Own it, document it, monitor it"],["VM Lead (Alicia Ellis)","Process or data-quality questions, aging technical blockers, corrections"],["VM Leadership (Chantel Miller)","Material aging, cross-functional blockers, unresolved system failures, productivity risk"],["IT / Leadership","System failures and interventions"]]},{"t":"p","text":"Before escalating ask: What is the exact blocker, who owns it, what is the next action, and what evidence is documented?"}]},{"id":"b6","title":"B6. Daily Reports (Ariba & SAP)","blocks":[{"t":"table","head":["Report","Purpose","Frequency"],"rows":[["Supplier Registration Report","Status tracking","Morning"],["Registration Questionnaire Report","Supplier responses","Morning"],["Insurance & Safety / SM Modular Questionnaire / COI & SAFETY REPORT","Compliance review","Morning"],["ZMM_PROC_LIFECYCLE","Supplier lifecycle","Daily"],["ME2N","PO activity","Daily"],["ME5A","PR activity, business justification","Daily"],["ZMMAQ_VOPEN","Open PO review","Daily"],["ME3M","Contract and payment terms validation","As needed"],["FBL1N","Open items; always run before vendor closure or inactivation","Before vendor closure"],["BP","Address, banking, role validation","Daily"],["XK03","Legacy vendor, bank and tax review","As needed"],["zscp_supp_extend","Other","As needed"],["XK99","Other","As needed"]]},{"t":"rep3"},{"t":"h","text":"File naming"},{"t":"table","head":["File","Name format"],"rows":[["Registration report","YYYY-MM-DD_Registration_Report"],["Questionnaire answers","YYYY-MM-DD_Questionnaire_Answers"],["Insurance & Safety export","YYYY-MM-DD_Insurance_Safety"],["Dashboard backup","YYYY-MM-DD_VM_Dashboard_Backup.html"]]},{"t":"p","text":"The SOP leaves the approved retention location “to be specified”; confirm it with your lead."}]},{"id":"b7","title":"B7. Accountability & Coverage","blocks":[{"t":"table","head":["Process","Primary","Escalation","Evidence"],"rows":[["Morning data readiness","Daily Dashboard Owner","VM Lead","Dashboard loaded, validated, shared"],["Supplier processing","Assigned VM Analyst","VM Lead","Supplier advanced or completed"],["Comments / Worked","Assigned VM Analyst","VM Lead","Current, specific, auditable"],["ServiceNow tracking","Assigned VM Analyst","VM Lead / IT","Ticket recorded, monitored, retested"],["EOD analyst review","Assigned VM Analyst","VM Lead","No worked item lacks a next step"],["Final shared data check","Daily Dashboard Owner","VM Lead","Dashboard and backup retained"],["Material risk escalation","VM Lead","VM Leadership","Risk visible with owner and action"]]},{"t":"h","text":"Exception rules"},{"t":"list","items":["Dashboard Owner absent: the named backup runs the refresh and final check","Analyst absent: VM Lead identifies urgent items; ownership does not change unless reassigned","Report unavailable: do not guess statuses; work from validated records and document the limitation","Dashboard unavailable: work from Ariba, SharePoint, Outlook, ServiceNow; backfill later","Cross-system data conflict: stop final approval until resolved or the VM Lead approves a documented path"]}]},{"id":"b8","title":"B8. End-of-Day Requirements","blocks":[{"t":"h","text":"Assigned analyst"},{"t":"check","items":["Every worked supplier marked Worked with a comment meeting the standard","Completed suppliers reflected accurately in the dashboard","Outstanding ISNet, COI and Safety requirements documented","Scope reviewed before any final approval","Supplier and requester follow-ups complete; threshold escalations documented","ServiceNow tickets recorded, and resolved ones updated after retesting","Progress against the 3-per-day goal reviewed; blockers documented if missed","Tomorrow’s Closest to Completion suppliers identified","HTML backup exported"]},{"t":"h","text":"Daily Dashboard Owner"},{"t":"check","items":["Shared dashboard available and reflects today’s load","All three exports retained in the dated folder","SharePoint-fed sections refreshed","Team notified of material data-quality issues","Final shared HTML backup completed or confirmed","Clear Data has not been used"]},{"t":"note","text":"Standard: a reviewer can see each supplier’s status, outstanding requirement, next owner and next action without asking the analyst."}]},{"id":"c1","part":"Part C: Execution System & Case Playbook","title":"C1. The Fastest Repeatable Process to 3+ Completions","blocks":[{"t":"note","text":"Goal: 3 completed registrations per person per business day. A registration counts as completed when a supplier open in one daily snapshot is registered in the next. An upload before noon Arizona time credits the previous business day. Saturdays and Sundays are skipped."},{"t":"h","text":"The day in seven moves"},{"t":"table","head":["Time","Move","Output"],"rows":[["8:00 AM","Validate dashboard: all 3 reports loaded and team chat confirmation posted. No stale data.","Ready dashboard"],["8:05 AM","Sort by priority: Pending Approval, Pending Resubmit, In Registration, Invited.","Priority list"],["8:15 AM","Fast-close sweep of Pending Approval using the Fast-Close Checklist.","3 targets"],["Morning","Review each supplier in master order; remove the single blocker; send follow-ups the same hour. Run ZMM_PROC_LIFECYCLE, ME2N, Registration Dashboard.","Completions + outreach"],["Midday","ZMMAQ_VOPEN: outstanding PO activity, supplier questions, invoice disputes. Recheck VM Rush.","Questions cleared"],["Afternoon","Run the Pending Approval report and push approvals; remember uploads before noon Arizona time credit the previous business day.","Approvals pushed"],["End of day","Worked status, comments, escalations, ServiceNow, tomorrow’s top 3, progress vs goal.","Auditable record"]]},{"t":"h","text":"Master process (integrates v5 controls, dashboard SOP, ISNet, BP, enablement, audit)"},{"t":"steps","items":["ISNet: YES makes ISNet the source of truth for insurance and safety (dashboard shows Covered by ISNet). Still work the Ariba questionnaires. No Company ID: ISNet follow-up first.","Tax: W-9 plus TINCheck (Line 1 legal name + TIN) or W-8. A failed tax validation is never approved.","Banking: Non-PO: AVS Clearway01. PO: Penny Test Clearway03. Failed: Challenge Test Clearway02.","CoC / ESG: Code of Conduct accepted; ESG questionnaire reviewed; evidence kept.","Insurance: Ariba COI is still worked, including for ISNet members: GL, Auto, WC, limits, expiry, Additional Insured.","Safety: Onsite or more than 10 employees: Ariba safety questionnaire, OSHA and EMR logs (3 years); ISNet status confirmed.","Scope: Valid scope of work present. No Scope = No Approval.","BP: Company code 3505, purchasing orgs, USD, Incoterms, Valid From 01/01/1900, FLVN00/FLVN01.","Enablement: Correct ANID, TRR accepted, PO and invoice tasks, supplier roles.","Audit: Evidence, screenshots, Request ID, notes. Could you defend this in a SOX audit?","Approve: All controls complete and required approvals obtained.","Document: Worked status, comment, next owner, next action, follow-up date."]},{"t":"p","text":"Every morning ask: which suppliers are closest to completion? Work Pending Approval, then Pending Resubmit, then In Registration, then Invited."}]},{"id":"c2","title":"C2. Fast-Close Checklist & Priority Matrix","blocks":[{"t":"h","text":"Review these first every morning"},{"t":"check","items":["Pending Approval status","Banking completed","Tax completed","BP exists","ANID exists","TRR accepted","Documentation attached"]},{"t":"p","text":"Also confirm: ISNet answered and Company ID verified (or follow-up sent), and Scope is present."},{"t":"table","head":["Priority","Status","Goal"],"rows":[["1","Pending Approval","Close immediately; remove the single blocker"],["2","Pending Resubmit","Supplier follow-up; attempt same-day correction"],["3","In Registration","Review missing items; contact supplier immediately"],["4","Invited","Monitor responses; send reminder outreach"]]}]},{"id":"c3","title":"C3. ISNet Protocol (Supersedes Ariba COI & Safety)","blocks":[{"t":"note","text":"When a supplier answers YES to ISNetWorld membership, the ISNet answer supersedes the Ariba COI and Safety questionnaires for compliance purposes, and their statuses show as Covered by ISNet. The Ariba COI and Safety questionnaires are still worked in addition to the ISNet verification."},{"t":"note","text":"Members without a verified Company ID or check still get the ISNet follow-up first: before insurance review, safety review, or rejection."},{"t":"p","text":"Suppliers that answered YES and also have Ariba COI or Safety records are listed for visibility only. Those Ariba questionnaires are still worked in addition to the ISNet verification."},{"t":"h","text":"ISNet validation checklist"},{"t":"check","items":["Company ID provided","Active ISNet membership verified","Insurance valid in ISNet","Safety compliant in ISNet","No outstanding compliance issues"]},{"t":"h","text":"Decision tree"},{"t":"steps","items":["Supplier answered YES to ISNetWorld membership?","No Company ID: send the ISNet follow-up (Email F) and stop; no insurance or safety review, no rejection","Company ID provided: verify ISNet membership","Dashboard shows Insurance and Safety as Covered by ISNet; still work the Ariba COI and Safety questionnaires","Continue Tax, Banking, Scope, BP, Enablement, Approval"]}]},{"id":"c4","title":"C4. Supplier Maintenance / Update Protocol","blocks":[{"t":"p","text":"A supplier update is not a registration. It is a correction or cleanup of the existing supplier master. Classify it first, then protect against inactivating a record that still has activity."},{"t":"table","head":["Request line","Typical action"],"rows":[["Keep active","Correct EIN, banking, remit-to address; match to W-9, payment instructions, recent invoice"],["Update","Correct EIN and banking; review and update the remit address"],["Make inactive","Old EIN, banking, remit address; only after activity checks pass"]]},{"t":"h","text":"Steps"},{"t":"steps","items":["Verify documentation: W-9, payment instructions, recent invoice (and any bill of sale or assignment) agree on legal name, Tax ID and remit address","Review every supplier record involved","XK03 / BP: banking, tax IDs, addresses, company code assignments","FBL1N on every record: open items","ME2N on every record: open POs","ZMM_PROC_LIFECYCLE: history and recent activity","Apply the decision table below","Check ISNet (a second workstream if the supplier is in ISNetWorld but not linked in Ariba)","Confirm contact functions before changing any contact","Process the update, attach evidence, comment"]},{"t":"table","head":["Finding","Action"],"rows":[["Open POs exist","Do not inactivate. Ask the buyer or requester which record stays active for purchasing"],["Open items / invoices (FBL1N)","Do not inactivate. Contact AP for closure timing and payment completion"],["No open activity","Block Vendor, Delete Flag, Archive Flag per the supplier deactivation process"]]},{"t":"note","text":"FBL1N is the primary control point. Do not inactivate any record until FBL1N and ME2N confirm no active financial or purchasing activity."}]},{"id":"c5","title":"C5. Scenario Response Protocol","blocks":[{"t":"p","text":"Send any scenario (email, Teams message, registration, banking, W-9, W-8, ISNet, Ariba, BP, escalation) using the submission template in Templates & Prompts, or use the Scenario Analyzer in the interactive version. Each response states where you are in the process, what is complete and missing, the blocker, next step, owner, executable tasks, email, reports, T-codes, escalation, audit documentation, whether it can close today, impact on the daily goal, and a dashboard comment."},{"t":"code","title":"Example scenario","lines":["Supplier Name: ABC Roofing","Status: Pending Approval","Issue: W-9 received but banking validation failed","Documentation: W-9, EFT Form, Bank Letter","Question: What should I do next?"]},{"t":"code","title":"Example response (abridged)","lines":["CURRENT PHASE: Banking validation","CURRENT STATUS: Pending Approval","WHAT IS COMPLETE: W-9 received; TIN validation passed","WHAT IS MISSING: Passed banking validation","NEXT STEP: Non-PO: AVS in Clearway01. PO: Penny Test in Clearway03. If Failed: Challenge Test in Clearway02","OWNER: Vendor Management","REPORTS: ME2N, ZMM_PROC_LIFECYCLE","ESCALATION: only if the Challenge Test fails or a fraud indicator appears","CAN BE COMPLETED TODAY: yes, if banking passes"]}]},{"id":"c6","title":"C6. Case Study: Supplier Maintenance (JM Test Systems LLC)","blocks":[{"t":"note","text":"Phase: Supplier Maintenance / Supplier Update (not a registration). Status: Pending Vendor Management Review. Requestor: Brittany Hannas."},{"t":"table","head":["Record","Requested action","Details"],"rows":[["BP 33000454","Keep active","Correct EIN, banking, remit-to; matches W-9, payment instructions, recent invoice"],["32000457","Update","Correct EIN and banking; remit address wrong, needs review and update"],["32000064","Make inactive","Old EIN, banking, remit address"],["32000554","Make inactive","Old EIN, banking, remit address"]]},{"t":"h","text":"Already complete"},{"t":"list","items":["Supplier identified","Supporting documentation, current invoice, W-9, payment instructions, Bill of Sale and Assignment attached","Desired outcome documented"]},{"t":"h","text":"Expected on all three source documents"},{"t":"table","head":["Field","Value"],"rows":[["Legal name","JM TEST SYSTEMS LLC"],["Tax ID","920636105"],["Remit address","Dept 6389, PO Box 11407, Birmingham, AL 35246-6389"]]},{"t":"h","text":"Next steps"},{"t":"steps","items":["Open the W-9, Payment Instructions, Invoice and Bill of Sale; compare legal name, Tax ID and remit address","Review all four records: 32000064, 32000554, 32000457, 33000454","XK03 / BP: banking, tax IDs, addresses, company code assignments","FBL1N on all four: if open items exist, STOP and contact AP","ME2N on all four: if open POs exist, do not inactivate; ask Gregory Harkey which record stays active","ZMM_PROC_LIFECYCLE: history and recent activity","No open activity: Block Vendor, Delete Flag, Archive Flag","ISNet: supplier is in ISNetWorld but not linked in Ariba; verify Company ID, follow up if missing; if verified, Insurance and Safety show as Covered by ISNet; still work the Ariba questionnaires","Contact cleanup: portal invoices by Kelly Seawell, payment contact accounting@jmtest.com; confirm functions before updating"]},{"t":"h","text":"Can this count toward today’s 3?"},{"t":"check","items":["Documentation supports the changes","No open PO conflicts","No open payment conflicts","Deactivation approvals completed","Supplier update processed today"]},{"t":"p","text":"Potentially yes if all are true; maintenance requests tend to close faster than new registrations. The completion rule is defined for registrations (open in one snapshot, registered in the next), so confirm with your VM Lead how maintenance items are credited."},{"t":"note","text":"Do not update contacts until functions are confirmed. Many suppliers intentionally separate invoice/portal and remittance contacts."}]},{"id":"c7","title":"C7. Quick Notes: Status, PI/OA, Aging Escalation, Report Pull","blocks":[{"t":"h","text":"Registration status cheat sheet"},{"t":"table","head":["Status","Meaning","Action"],"rows":[["Invited","Registration sent","Follow up"],["In Registration","Supplier working","Identify missing requirements"],["Pending Resubmit","Supplier correction needed","Supplier outreach"],["Pending Approval","Ready for VM review","Prioritize completion"]]},{"t":"h","text":"PI vs OA"},{"t":"table","head":["Type","Used for","Details"],"rows":[["PI (Invoicing Party)","Receives payments","Stores banking information; used by AP; FLVN00 financial role"],["OA (Ordering Address)","Receives purchase orders","No banking information, no payment activity; FLVN01 purchasing role"]]},{"t":"h","text":"Aging escalation matrix"},{"t":"table","head":["Scenario","Threshold","Action"],"rows":[["Invited",">14 days","Send reminder"],["Invited",">30 days","Escalation required"],["In Registration",">30 days","Escalation required"],["Pending Resubmit",">14 days","Reminder"],["Pending Resubmit",">30 days","Escalation required"],["Pending Approval",">10 business days","Internal review"],["Missing contact","Any","Recipient needed"],["Missing form assignment","Any","Forms Review Queue"],["Missing file data","Any","Review required"]]},{"t":"h","text":"Ariba report pull"},{"t":"steps","items":["Home → Manage (top right) → Prepackaged reports → Supplier Lifecycle Reports → open Supplier Registration Project report → open → export","Registration Questionnaire Report (under Supplier Lifecycle Report)","SM Modular Questionnaire (light version of Insurance and Safety): Options, filter Owner, Options → Ignore Max results, table options → Questionnaire Type, Search, Save Search"]},{"t":"h","text":"Temporary Ariba pull for the VM pending sheet"},{"t":"steps","items":["In Ariba click under the Type field (same area as the Non-PO form) → Supplier Account update form","Unselect / clear your name","Change STATUS to Submitted","Click Search, or enter search criteria to save the file"]},{"t":"h","text":"Draft follow-up emails from the report data"},{"t":"steps","items":["Open Outlook","Click Claude on the ribbon","Attach the 3 downloaded files and the prompt, then run it"]}]},{"id":"c8","title":"C8. NPO and PO Audit Checklists","blocks":[{"t":"p","text":"Save each completed checklist as “Supplier NAME – NPO Supplier Audit Checklist” or “Supplier NAME – PO Supplier Audit Checklist”. Fillable versions are in the Audit Checklists tab of the interactive page."},{"t":"h","text":"NPO supplier audit checklist"},{"t":"p","text":"Fields: NPO Supplier, DBA, Type (Landowner / Donation-Contribution / One-time vendor / Other), Ariba ID, S/4 BP #, Date."},{"t":"check","items":["Run duplicate check (in S/4) FIRST","Name and DBA check","W-9 / W-8","Landowner: contract available and signed","Donation / contribution: VP approval provided","One-time vendor etc.: invoice","Remittance address check (USPS address lookup site)","Banking on bank letterhead or voided check","EFT form","TIN check validation","Ariba form added to S/4","Supporting docs added to S/4"]},{"t":"h","text":"PO supplier audit checklist"},{"t":"p","text":"Fields: Supplier, DBA, Work location (On-site / Off-site), Ariba ID, S/4 BP #, Date."},{"t":"check","items":["Name and DBA check","Scope of work","W-9 / W-8","Remittance address","Invoice","Banking letterhead or voided check","On site: ISN, COI and safety","Off site: COI approvals","S/4 BP created / updated","TIN check validation","Ariba form added to S/4","Supporting docs added to S/4"]}]},{"id":"c9","title":"C9. Non-PO and PO Process by Scope","blocks":[{"t":"p","text":"Pick the process by supplier scope. Each step lists what to verify. The ISNet-first rule, Ariba COI/Safety work, No Scope = No Approval, and the daily deadline apply to both."},{"t":"h","text":"Non-PO process"},{"t":"p","text":"Documents: Supplier form, W-9 (or W-8), EFT authorization form, bank letter or voided check, plus the type document (landowner contract, donation VP approval, or invoice)."},{"t":"steps","items":["ISNet first: Did the supplier answer YES? Verify the Company ID. No ID: ISNet follow-up first. The dashboard shows Covered by ISNet; Ariba COI and Safety questionnaires are still worked if they apply.","Duplicate check: Run the duplicate check in S/4 FIRST. A duplicate BP goes to your Supervisor.","Name and DBA: Legal name and DBA agree across the form, W-9/W-8 and supporting document. Only the Line 1 legal name goes into TINCheck.","Tax: W-9 / W-8: W-9 current, signed, dated; TINCheck passed. Foreign: W-8 workflow. See the W-8 / W-9 tab.","Type document: Landowner: contract available and signed. Donation / contribution: VP approval provided. One-time vendor and other: invoice.","Remittance address: Check the remittance address on the USPS address lookup site and match it to the W-9 and invoice.","Banking: AVS: Bank letterhead or voided check plus the EFT form. Run AVS in Clearway01 with the exact legal name, routing and account numbers; leave address fields blank; save a screenshot. Documents differ: reject and request correction.","Scope: Scope present. No Scope = No Approval.","S/4 and Ariba: Ariba form and supporting docs added to S/4. BP created or updated: company code 3505, USD, Valid From 01/01/1900, FLVN00 financial role.","Approve + comment: All controls done; add the approval comment (Approval Notes tab), mark Worked, set next owner, next action and follow-up date."]},{"t":"h","text":"PO process: on-site"},{"t":"p","text":"Documents: Supplier registration, W-9 or W-8, banking documentation, insurance documentation, safety documentation, procurement approval."},{"t":"steps","items":["ISNet first: Did the supplier answer YES? Verify the Company ID. No ID: ISNet follow-up first. The dashboard shows Covered by ISNet; the Ariba COI and Safety questionnaires are still worked.","Name and DBA: Legal name and DBA agree across the registration, W-9/W-8, contract and invoice. Only the Line 1 legal name goes into TINCheck.","Scope of work: Scope of work present and matches the request. No Scope = No Approval.","Tax: W-9 / W-8: W-9 current, signed, dated; TINCheck passed. Foreign: W-8 workflow. See the W-8 / W-9 tab.","Remittance + invoice: Remittance address matches the W-9 and the invoice; invoice received.","Banking: Penny Test: Bank letterhead or voided check. Run the Penny Test in Clearway03; capture the Request ID at once (Tracking Log, Form Notes, Audit Form). Failed: Challenge Test in Clearway02. International: IBAN validation.","Code of Conduct / ESG: Code of Conduct acceptance and ESG questionnaire reviewed; evidence kept.","Insurance + safety (on-site): On-site: ISN, COI and safety. ISN members: verify in ISNet and still work the Ariba COI and Safety questionnaires. Non-ISN: Modular Insurance Questionnaire, COI, OSHA logs and EMR for 3 years. Concerns go to EHS or the Risk Team.","BP in S/4: Create or update the BP: company code 3505, purchasing orgs 1000 to 6000, USD, Incoterms, Valid From 01/01/1900, FLVN00 and FLVN01 roles. Duplicate BP: Supervisor.","Ariba enablement: Correct ANID, TRR sent and accepted, PO and invoice tasks, supplier roles.","Audit evidence: Ariba form and supporting docs added to S/4; screenshots, Request ID and notes attached. Could you defend this in a SOX audit?","Approve + comment: All controls done; add the approval comment (Approval Notes tab), mark Worked, set next owner, next action and follow-up date."]},{"t":"h","text":"PO process: off-site (differences)"},{"t":"p","text":"Same steps as on-site, except: Insurance (off-site): Off-site: COI approvals (GL, Auto, WC, limits, expiry, Additional Insured). Safety is still required if the supplier has more than 10 employees. Documents: Supplier registration, W-9 or W-8, banking documentation, COI / insurance documentation, safety documentation only if more than 10 employees, procurement approval."}]},{"id":"c10","title":"C10. W-9 Review and Entry Guide","blocks":[{"t":"h","text":"What to look for"},{"t":"check","items":["Current IRS W-9 (check the revision date against irs.gov) currently using March 2024 version","Line 1: legal name exactly as on the IRS record (individual: personal name; entity: entity name)","Line 2: DBA or business name only, never in Line 1","Single-member LLC (disregarded entity): owner’s name on Line 1, LLC name on Line 2","Line 3: one federal tax classification checked; LLC letter (C, S, P) entered for an LLC","Line 4: exemption codes only when they apply; question anything unusual","Address complete and matches the remittance address on the invoice and bank documents","Part I: one TIN (SSN or EIN), 9 digits, type fits the classification","Part II: signed and dated","Name, TIN and address agree across the W-9, invoice, contract or VP approval, and bank letter"]},{"t":"h","text":"Steps to validate and enter properly"},{"t":"steps","items":["Open the W-9; confirm it is current, signed and dated","Copy Line 1 and the TIN exactly as printed. Never substitute the DBA, AKA, FKA, NKA or a nickname","Run TINCheck with the Line 1 legal name + TIN; save the result and a screenshot","Pass: record it in Form Notes and the Audit Form; attach the W-9 and the TINCheck result","Compare the remittance address with the invoice and bank documents (Non-PO: USPS address lookup)","Enter the legal name, address and TIN in the BP exactly as validated, following your BP creation steps (v5 gives no field-by-field navigation; confirm details with your lead)","Add the Ariba form and supporting docs to S/4, then continue to banking: Non-PO AVS in Clearway01, PO Penny Test in Clearway03"]},{"t":"h","text":"What to avoid or challenge"},{"t":"list","items":["Never run TINCheck with a DBA or alternate name","Challenge a DBA or trade name on Line 1","Challenge an individual’s name on Line 1 for an entity, and the reverse","Challenge an LLC name on Line 1 for a disregarded entity: owner name required","Challenge a classification that does not fit the TIN type (for example a corporation with an SSN)","Challenge a foreign address or foreign status on a W-9: use the W-8 workflow","Challenge address differences between the W-9, invoice and bank documents","Never approve a failed tax validation or an unsigned, undated form","Never accept an ITIN: escalate to AP Leadership","Do not correct a supplier’s form yourself: request a corrected, signed W-9"]},{"t":"h","text":"Tax-exempt (501(c)(3)) supplier"},{"t":"steps","items":["TINCheck","GuideStar verification","Address validation","Banking validation","Documentation notes"]},{"t":"p","text":"Retain the GuideStar screenshot, address validation evidence, TINCheck result and the W-9."}]},{"id":"c11","title":"C11. W-8BEN-E Review and Entry Guide","blocks":[{"t":"p","text":"Items beyond the v5 Canadian review (such as form validity and address rules) are general IRS form conventions. Confirm company-specific rules with Tax/AP Leadership."},{"t":"h","text":"What to look for"},{"t":"check","items":["Correct form: W-8BEN-E for an entity. Individuals use W-8BEN; any other W-8 type goes to Tax/AP Leadership","Part I name is the legal entity name and matches the contract and invoice","Country of incorporation or organization listed (Canada for a Canadian supplier)","FATCA status (chapter 4) complete","Permanent residence address is in the treaty country (not a PO box); mailing address given if different","Foreign TIN present (CRA Business Number for Canada) or a valid reason given","Treaty claim: treaty country matches the country of residence (Canada)","Limitation on Benefits (LOB) checked","Line 15 completed for services, when applicable","Signed and dated, with signer capacity","Form still valid (generally through the third calendar year after signing unless circumstances change): confirm your retention rule with Tax","No U.S. EIN requested solely because the supplier is Canadian"]},{"t":"h","text":"Steps to validate and enter properly"},{"t":"steps","items":["Confirm the supplier is foreign and the right W-8 type was supplied","Review every checklist item; for Canada confirm CRA Business Number, treaty country Canada, LOB, and Line 15 for services","Record the review in Form Notes; attach the W-8BEN-E","Banking: use the IBAN validation process for applicable international bank accounts instead of starting with AVS or the Penny Test","Enter the supplier in the BP following your BP creation steps; add the Ariba form and supporting docs to S/4"]},{"t":"h","text":"What to avoid or challenge"},{"t":"list","items":["Do not request a U.S. EIN solely because the supplier is Canadian","Do not decide treaty questions yourself: Tax/AP Leadership","Challenge missing FATCA, treaty, LOB, Line 15 (services), signature or date","Challenge a PO box or a non-treaty-country permanent residence address","Challenge a W-8 from a supplier who is actually a U.S. person: use the W-9 workflow","Challenge an out-of-date form (confirm your retention rule)"]}]},{"id":"c12","title":"C12. Tax Form Send-Back and Escalation Matrix","blocks":[{"t":"h","text":"W-9"},{"t":"table","head":["Finding","Action","Email","Owner"],"rows":[["TINCheck name/TIN mismatch","SEND BACK: Request a corrected W-9 with the exact IRS legal name on Line 1","Email A","Supplier"],["DBA entered on Line 1","SEND BACK: Request a corrected W-9: legal name on Line 1, DBA on Line 2","Email A","Supplier"],["Unsigned or undated","SEND BACK: Reject and return: request a signed and dated W-9","Email I","Supplier"],["Old or wrong form version","SEND BACK: Request the current IRS W-9","Email I","Supplier"],["Tax classification blank or does not fit the TIN type","SEND BACK: Request a corrected W-9 with the classification completed (edit the reason in Email A)","Email A","Supplier"],["LLC disregarded entity with the LLC name on Line 1","SEND BACK: Owner name required on Line 1","Email A","Supplier"],["Foreign address or foreign status on a W-9","SEND BACK: Challenge: foreign suppliers use the W-8 workflow","Email E","Supplier"],["Address differs between W-9, invoice and bank documents","SEND BACK: Ask the supplier to confirm the correct remit-to address; do not update until confirmed","None","Supplier / Requester"],["ITIN submitted","ESCALATE: Do not approve. Escalate to AP Leadership","None","AP Leadership"],["TINCheck still fails after a corrected W-9","ESCALATE: Do not approve. Escalate to your Supervisor (confirm the path with your lead)","None","Supervisor"],["Tax or banking change from a Gmail/Yahoo address, spoofed email, or supplier refuses callback","ESCALATE: Escalate immediately to Supervisor + Director; do not dismiss","None","Supervisor + Director"],["Legal exception or contract tax question","ESCALATE: Escalate to the Legal Team","None","Legal Team"]]},{"t":"h","text":"W-8BEN-E"},{"t":"table","head":["Finding","Action","Email","Owner"],"rows":[["FATCA status missing or incomplete","SEND BACK: Request an updated W-8BEN-E with the FATCA certification completed","Email E","Supplier"],["Treaty claim missing or country does not match residence","SEND BACK: Request the treaty section completed","Email E","Supplier"],["Limitation on Benefits not checked","SEND BACK: Request the LOB section completed","Email E","Supplier"],["Line 15 not completed for services","SEND BACK: Request Line 15 completed","Email E","Supplier"],["Foreign TIN / CRA Business Number missing","SEND BACK: Request the foreign TIN (CRA Business Number for Canada) or the reason it is not required","Email E","Supplier"],["Unsigned, undated, or no signer capacity","SEND BACK: Request a signed and dated W-8BEN-E","Email E","Supplier"],["Permanent residence address missing, a PO box, or outside the treaty country","SEND BACK: Request a corrected permanent residence address","Email E","Supplier"],["Supplier is actually a U.S. person","SEND BACK: Switch to the W-9 workflow","Email I","Supplier"],["Someone asked for a U.S. EIN only because the supplier is Canadian","NOTE: Do not request a U.S. EIN solely because the supplier is Canadian","None","-"],["Wrong W-8 type (individual, effectively connected income, intermediary)","ESCALATE: Route to Tax/AP Leadership to confirm the right form","None","Tax/AP Leadership"],["Treaty question or unusual treaty position","ESCALATE: Escalate to Tax/AP Leadership","None","Tax/AP Leadership"],["Tax or banking change from a Gmail/Yahoo address, spoofed email, or supplier refuses callback","ESCALATE: Escalate immediately to Supervisor + Director; do not dismiss","None","Supervisor + Director"],["Legal exception or contract tax question","ESCALATE: Escalate to the Legal Team","None","Legal Team"]]},{"t":"h","text":"By scope"},{"t":"table","head":["Scope","Also required with the tax form","Banking path"],"rows":[["Non-PO","Supplier form, EFT authorization form, bank letter or voided check, type document (landowner contract, donation VP approval, or invoice)","AVS, Clearway01 (address blank)"],["PO","Supplier registration, banking documents, insurance, safety if required, procurement approval","Penny Test, Clearway03; failed: Clearway02"],["Foreign (either)","W-8 workflow; Tax/AP Leadership for treaty questions","IBAN validation for applicable international banking"]]}]},{"id":"c13","title":"C13. Confirm With Your Lead","blocks":[{"t":"p","text":"Open items the playbooks do not answer. Get the answer, record who confirmed it, then update the guide."},{"t":"check","items":["SLA targets for each request type","Detailed ESG acceptance criteria","Insurance coverage thresholds","W-9: who gets a TINCheck that still fails after a corrected W-9","How maintenance / supplier update requests credit to the 3-per-day goal","How long Ariba takes to show “Registered” after approval and S/4 keying","Latest time a registration can be completed and still count for the day","Whether an unfinished Ariba COI/Safety questionnaire blocks Pending Approval when ISNet is verified","Exact SAP report filter values and saved variants","Approved email distribution lists and recipient addresses","Screen-by-screen S/4 BP creation navigation and tax-number fields","Complete Ariba integration troubleshooting sequence","Approved retention location for dashboard exports and backups","W-8BEN-E retention and expiry practice","Treaty question escalation path and contacts (Tax/AP Leadership)"]}]},{"id":"c14","title":"C14. Supplier Onboarding Dashboard: How It Works","blocks":[{"t":"p","text":"The interactive page has a Supplier Onboarding Dashboard (Plan stage). Upload the 3 daily reports and it shows Ariba registration, ISNet, COI and Safety across every owner."},{"t":"h","text":"Daily load"},{"t":"steps","items":["Run the 3 reports and save them as YYYY-MM-DD_Registration_Report, YYYY-MM-DD_Questionnaire_Answers and YYYY-MM-DD_Insurance_Safety","Open the dashboard, tap Upload daily reports, and select all 3 files at once","Check each file’s type and report date, then tap Load files","Confirm all 3 files show as loaded; the report tick boxes are ticked for you when today’s 3 are loaded"]},{"t":"h","text":"How suppliers are classified"},{"t":"table","head":["Item","Rule"],"rows":[["Owner","Grouped by the owner of the original registration form; COI and Safety records follow the registration owner"],["ISNet","Yes to ISNetWorld: COI and Safety show as Covered by ISNet. Yes without a Company ID: ISNet follow-up first"],["Days since update","Latest of the begin, submission and reinvite dates on the registration report. Ariba exports no status-change date, so an item can sit in a status without its date moving"],["Completed","A supplier open in one report date and Registered in the next. Credit date: a snapshot uploaded before 12:00 PM Arizona credits the previous business day; weekends are skipped"]]},{"t":"h","text":"Closest to completion (oldest first in each group)"},{"t":"table","head":["Group","Definition"],"rows":[["Final VM review","Pending Approval: ready for VM to review and approve"],["Insurance/Safety Team","Only COI or Safety is left; next step is with the Insurance/Safety team"],["One Supplier item left","One supplier action left (ISNet Company ID, scope or primary contact), or the supplier only has to submit"],["Resubmit/One Fix","Pending Resubmit: the supplier makes one correction and it goes back to approval"]]},{"t":"note","text":"The exact column names in the Ariba exports are not documented here. The importer matches columns automatically and lets you correct the match; confirm the result in the Import log."}]}],"emails":[["A. W-9 rejection / correction","Updated W-9 Required","During the tax validation review, we were unable to validate the legal name and Tax ID combination submitted on the W-9.\n\nPlease provide an updated signed W-9 reflecting the IRS legal name exactly as registered with the IRS. Once received, we will re-run validation and continue processing your supplier request."],["B. Banking callback confirmation","Banking Information Confirmation Required","As part of our supplier banking verification process, please confirm the bank account information recently submitted to Clearway.\n\nPlease reply confirming that the account and routing information provided are accurate and authorized for payment processing. Once confirmed, we will continue processing your supplier request."],["C. Missing insurance","Insurance Documentation Required","Your supplier onboarding request is currently pending due to missing or incomplete insurance documentation.\n\nPlease provide the requested Certificate of Insurance and any supporting documentation so we may continue processing."],["D. Missing banking","Banking Documentation Required","Your supplier request is currently pending banking validation.\n\nPlease provide a current bank letter or voided check along with completed EFT documentation. Once received, we will continue processing your request."],["E. Missing W-8 information","Updated W-8BEN-E Required","During review of the W-8BEN-E submitted, we identified missing or incomplete information required for validation.\n\nPlease review and update the treaty claim, FATCA certification, and signature sections before resubmitting."],["F. Missing ISNet Company ID","ISNetWorld Company ID Needed","Thank you for confirming that your company is an active ISNetWorld member.\n\nTo allow us to complete our supplier review, please provide your ISNetWorld Company ID or Registration Number.\n\nOnce received, we will verify your membership and continue processing your supplier registration.\n\nPlease let me know if you need any assistance completing these steps. Happy to help."],["G. Pending supplier registration follow-up","Supplier Registration: Information Needed","We are currently reviewing your supplier registration and are waiting on the remaining required information listed below:\n\n[Missing Item]\n\n[Missing Item]\n\nOnce received, we will continue processing your registration.\n\nPlease let me know if you need any assistance completing these steps. Happy to help."],["H. Pending resubmit request","Supplier Registration: Updates Required","Your supplier registration requires additional information before it can be approved.\n\nPlease review and update the following items:\n\n[Correction Needed]\n\n[Correction Needed]\n\nAfter the updates are submitted, we will review and continue processing your registration.\n\nPlease let me know if you need any assistance completing these steps. Happy to help."],["I. Missing W-9","Signed W-9 Required","To continue processing your supplier request, we require a signed and dated IRS Form W-9.\n\nPlease provide an updated W-9 reflecting your IRS legal business name and tax identification number.\n\nUpon receipt, we will complete tax validation and continue processing.\n\nPlease let me know if you need any assistance completing these steps. Happy to help."],["J. Escalation to requester","Supplier Registration On Hold: Assistance Needed","We have made multiple attempts to obtain the required information needed to complete the supplier registration; however, the requested documentation has not yet been received.\n\nThe supplier registration remains on hold pending receipt of the required information.\n\nPlease assist in coordinating with the supplier so we can proceed with onboarding."],["K. AP: open items check (maintenance)","Open Items Review: [Supplier Name] / BP [Number]","We are processing a supplier maintenance request that includes making the following supplier record(s) inactive: [BP Numbers].\n\nBefore we inactivate, please confirm whether any open items, invoices or pending payments exist on these records, and the expected closure or payment timing.\n\nWe will hold the inactivation until we hear from you."],["L. Buyer / requester: which record stays active","Which Supplier Record Should Stay Active? [Supplier Name]","We are consolidating supplier records for [Supplier Name]. Open purchase orders exist on [BP Number(s)].\n\nPlease confirm which supplier record should remain active for purchasing so we can complete the update without disrupting open POs."],["M. Supplier: confirm contact functions","Contact Confirmation: [Supplier Name]","While reviewing your supplier record we noticed portal invoicing is handled by [Contact Name], while payment and remittance notices go to [Email].\n\nPlease confirm whether this is intentional, and which contact should receive invoice/portal activity and which should receive remittance/payment notices.\n\nWe will not change contact information until we hear from you."],["N. Requester: maintenance update status","Supplier Maintenance Update: [Supplier Name]","Your supplier maintenance request has been reviewed. The W-9, payment instructions and invoice [match / do not match] on legal name, Tax ID and remit-to address.\n\nStatus by record:\n\n[BP Number]: [Updated / Kept active / Pending: reason]\n\n[BP Number]: [Inactivated / On hold: open PO or open item]\n\nPlease let us know if you have any questions."]],"cheat":[{"h":"Banking path","head":["Supplier","Method","Profile"],"rows":[["Non-PO","AVS (address blank)","Clearway01"],["PO","Penny Test (save Request ID)","Clearway03"],["Failed Penny","Confidence/Challenge","Clearway02"]]},{"h":"Penny Test status","head":["Status","Action"],"rows":[["Processing","Wait"],["Completed","Approve"],["Processing Error","Resubmit"],["Failed","Clearway02"]]},{"h":"Insurance findings","head":["Finding","Action"],"rows":[["None / expired","Hold"],["No Additional Insured","Return"],["Insufficient coverage","Return"],["Exception","Risk Team"]]},{"h":"Escalate to","head":["Issue","Owner"],"rows":[["ITIN","AP Leadership"],["Treaty","Tax/AP Leadership"],["Failed Challenge / Fraud","Supervisor + Director"],["Integration failure","Cognitus"],["Duplicate BP","Supervisor"],["ANID conflict","Enablement Team"],["Legal","Legal Team"],["Safety","EHS"],["Insurance exception","Risk Team"],["Aging, process or data quality","VM Lead → VM Leadership → IT / Leadership"],["Before escalating","Exact blocker, owner, next action, evidence"]]},{"h":"Key values","head":["Item","Value"],"rows":[["Company code","3505"],["Purch. orgs","1000–6000"],["Currency","USD"],["Address Valid From","01/01/1900"],["Roles","FLVN00; FLVN01 (PO)"],["Safety needed","Onsite or >10 employees"],["OSHA / EMR","3 years"]]},{"h":"“I can’t see my PO”","head":["Order","Check"],"rows":[["1","TRR accepted"],["2","Tasks assigned"],["3","Supplier roles assigned"],["4","Date filter = 365 days"]]},{"h":"Fraud triggers: escalate now","head":["Trigger"],"rows":[["Gmail/Yahoo banking change"],["Spoofed email indicators"],["Returned deposits"],["Refuses callback"],["Cannot verify deposits twice"]]},{"h":"Golden rules","head":["Rule"],"rows":[["Goal: 3 completions per analyst per day (15/week)"],["Review order: ISNet → Tax → Banking → Insurance → Safety → Scope → Approval"],["ISNet YES = source of truth; still work Ariba COI & Safety; no Company ID = ISNet follow-up first"],["No Scope = No Approval"],["Every supplier: Worked, comment, blocker, next owner, next action, follow-up date"],["Never select Clear Data"]]},{"h":"Maintenance control point","head":["Finding","Action"],"rows":[["Open POs","Do not inactivate; ask buyer"],["Open items (FBL1N)","Do not inactivate; contact AP"],["No open activity","Block, Delete Flag, Archive Flag"]]},{"h":"Aging escalation","head":["Scenario","Action"],"rows":[["Invited >14 days","Send reminder"],["Invited >30 days","Escalation required"],["In Registration >30 days","Escalation required"],["Pending Resubmit >14 days","Reminder"],["Pending Resubmit >30 days","Escalation required"],["Pending Approval >10 business days","Internal review"],["Missing contact ","Recipient needed"],["Missing form assignment ","Forms Review Queue"],["Missing file data ","Review required"]]},{"h":"PI vs OA","head":["Type","Role"],"rows":[["PI Invoicing Party","Payments, banking, AP, FLVN00"],["OA Ordering Address","POs only, no banking, FLVN01"]]},{"h":"Tax form actions","head":["Finding","Action"],"rows":[["Name/TIN mismatch, DBA on Line 1","Send back: corrected W-9 (Email A)"],["Unsigned, undated, old form","Return: Email I"],["ITIN","Escalate: AP Leadership"],["Foreign status on a W-9","Use the W-8 workflow"],["W-8 missing FATCA, treaty, LOB, Line 15, signature","Send back: Email E"],["Treaty question","Tax/AP Leadership"],["Canadian supplier","No U.S. EIN just for being Canadian"]]}],"notes":[["ServiceNow / IT escalation notes",["Issue Summary: Supplier onboarding is currently blocked due to a system-related issue.","Supplier: [Supplier Name]","BP Number: [BP Number]","Issue: [System Error]","Business Impact: Supplier onboarding cannot proceed until issue is resolved.","Requested Action: Review and correct system issue preventing supplier processing.","Ticket Owner: [IT Team]","Submitted By: Vendor Management"]]],"prompts":[["Scenario submission template (copy and paste with every case)",["Supplier Name:","Supplier ID/BP:","Requester:","Request Type: (New Registration / Supplier Update / Banking / Tax / Enablement / ISNet / Other)","Registration Status: (Invited / In Registration / Pending Resubmit / Pending Approval / N/A)","Supplier Type: (PO / Non-PO / US / International)","Current Phase:","Issue:","Documents Received:","Notes:","Question:"]],["Response format the assistant should provide",["CURRENT PROCESS PHASE","CURRENT STATUS","WHAT IS COMPLETE","WHAT IS MISSING","PRIMARY BLOCKER","IMMEDIATE NEXT STEP","FULL TASK LIST","OWNER OF NEXT ACTION","EMAIL TO SEND","REPORTS TO REVIEW","SAP T-CODES TO REVIEW","ESCALATION REQUIRED","AUDIT DOCUMENTATION REQUIRED","CAN THIS BE COMPLETED TODAY?","IMPACT TO DAILY GOAL","RECOMMENDED COMMENT FOR DASHBOARD","PRIORITY LEVEL","EXPECTED COMPLETION PATH"]],["Supplier maintenance add-on (append to the template for update requests)",["Records to keep active: [BP]","Records to update: [BP]","Records to make inactive: [BP]","Documents compared (W-9 / payment instructions / invoice): [match? Y/N]","FBL1N open items result: [per BP]","ME2N open PO result: [per BP]","ISNet status: [Company ID / not provided]","Contact roles in question: [name, email, function]"]],["Comment template (use every time)",["Curren
