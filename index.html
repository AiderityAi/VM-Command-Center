"Supporting docs added to S/4"],"op2":{"deadline":["LOAD 8:00 AM: dashboard refreshed, 3 reports loaded, chat confirmed.","POST by 12:00 PM: morning assignments submitted. A snapshot uploaded before 12:00 PM AZ credits the PREVIOUS business day.","REGISTER by 3:00 PM (work target): approvals and S/4 keying done so status can update.","COUNTS TODAY if the supplier shows Registered in the next business day’s snapshot (uploaded before 12:00 PM AZ). Weekends skipped.","WEEK: Mon to Fri, 15 total (3 x 5). Friday’s last completions post with Monday’s pre-noon snapshot."],"start":["Team chat confirms the refresh","Sort: Pending Approval first; pick 3 targets","Run ZMM_PROC_LIFECYCLE, ME2N, Registration Dashboard","Review aged suppliers, ServiceNow, VM Rush"],"fast":["Banking + Tax complete","BP, ANID, TRR in place","Scope present, docs attached"],"steps":[["1","ISNet first",["YES? Company ID provided (no ID: ISNet follow-up FIRST)","Membership, insurance, safety verified in ISNet","Dashboard shows Covered by ISNet; still work Ariba COI + Safety"]],["2","Tax",["US: W-9 signed, dated, TINCheck passed","Foreign: W-8, treaty, FATCA complete"]],["3","Banking",["Non-PO: AVS (Clearway01)","PO: Penny Test (Clearway03), Request ID saved","Failed: Challenge Test (Clearway02) + callback"]],["4","Insurance and Safety",["Insurance approved","Safety approved (onsite or >10 employees)"]],["5","Scope and registration",["Scope completed (No Scope = No Approval)","Internal approvals + documentation complete"]],["6","Final approval",["Tax, Banking, Insurance, Safety, Scope complete","BP, ANID, TRR, tasks complete","Comment updated, Worked checked, approve"]]],"maint":["W-9, payment instructions, invoice match","XK03 / BP review of every record","FBL1N + ME2N on every record","Open items or POs? STOP: contact AP / buyer","No activity: Block, Delete Flag, Archive Flag","Contact functions confirmed before change"],"comment":"Current Status · Completed · Outstanding · Current Blocker · Next Owner · Next Action · Follow-Up Date · Completion Risk (Y/N)","eod":["Every worked supplier marked Worked + meaningful comment","Approvals and S/4 keying done by 3:00 PM","Completed suppliers registered BEFORE the next pre-noon snapshot","VM Rush rechecked","Blockers + ServiceNow documented","Follow-ups and escalations sent (aging matrix)","Audit evidence attached","Tomorrow’s top 3 identified; progress vs 3-per-day logged"],"strip":"ISNet First → Tax → Banking → Insurance → Safety → Scope → Approval  ·  Pending Approval = Work First  ·  No Scope = No Approval  ·  Never Clear Data","reports":["Supplier Registration Report","Registration Questionnaire Response Report","Insurance & Safety / SM Modular Questionnaire / COI & SAFETY REPORT"]},"design":{"pal":[["Background","#F6F1FF","#0C0A1F","Page base"],["Ink (text)","#241A45","#F2EEFF","Body text"],["Muted text","#6A608A","#B0A6D4","Captions, hints"],["Accent (strong)","#6A46F0","#C1B1FF","Headings, links"],["Accent 2 (teal)","#067A68","#7FF5D3","Subheads, success"],["Lavender","#B9A6FF","","Gradient 1, pills"],["Sky","#8FD3FF","","Gradient 2"],["Mint","#8FF0D0","","Gradient 3, success"],["Peach","#FFC6A8","","Gradient 4, warm"],["Pink","#FFA8D8","","Highlights"],["Lemon","#FFF0A8","","Callouts"],["Note fill","#FFF1C9","#3D3217","Notes, warnings"],["Note border","#F0A93A","#F5C76A","Note left bar"],["OK fill","#D9F8EC","#0F3A31","Success panels"],["Alert fill","#FFDFE9","#4D1A36","Blocker panels"]],"aur":[["Blob 1","#CDBFFF","#5B45C9"],["Blob 2","#B6F5E0","#14907B"],["Blob 3","#FFD3C0","#B5586C"],["Blob 4","#BFE3FF","#2A72B8"],["Blob 5","#FFC4E6","#A8439A"]],"prio":[["1 Pending Approval","#B9F5DD → #D6FBE9","glow #7FF5D3"],["2 Pending Resubmit","#FFD6BD → #FFE9D9","glow #FFB48A"],["3 In Registration","#FFC2E4 → #FFE0F1","glow #FF8FD0"],["4 Invited","#C9DEFC → #E4EEFF","glow #8FB8FF"]],"type":[["Body","Space Grotesk 400/600/700","16px / 1.55"],["Display (h1, numbers, step pills)","Orbitron 600/800","h1 2.6rem (41.6px), letter-spacing .02em"],["Section heading (h2)","Orbitron 600","1.15rem, letter-spacing .05em"],["Kicker","Orbitron 700",".7rem, letter-spacing .34em, uppercase"],["Small / table","Space Grotesk",".86–.92rem"],["Fallback stack","system-ui, Segoe UI, Arial","Windows, Mac, iOS, Android"]],"num":[["Page max width","1060px"],["Page side padding","16px"],["Card padding","18px"],["Card radius","22px"],["Input / table / note radius","14px"],["Details / accordion radius","18px"],["Pill (buttons, chips)","99px"],["Spacing scale","4 · 8 · 12 · 16 · 18 · 24px"],["Grid gap","14px"],["Border","1px, rgba(124,98,230,.22) light, rgba(190,170,255,.24) dark"],["Card shadow","0 12px 44px rgba(106,70,240,.16)"],["Glow","0 0 22px rgba(143,211,255,.7) light, rgba(127,245,211,.55) dark"],["Glass blur","backdrop-filter: blur(16px)"],["Background grid","52px lines at 32% opacity, radial mask"],["Min touch target","44px"],["Motion","aurora 26s, shimmer 8s, pane fade .45s cubic-bezier(.2,.8,.2,1), hover lift 2px"],["Gradient","linear-gradient(120deg,#B9A6FF,#8FD3FF 45%,#8FF0D0 75%,#FFC6A8)"]]},"starters":[["New Non-PO: donation","New Non-PO","New donation supplier, VP approval attached, TIN/Address/Banking-Check. W9 Validated. Payment Terms checked."],["New Non-PO: landowner","New Non-PO","New landowner supplier, signed contract attached, TIN/Address/Banking-Check. W9 Validated. Payment Terms checked."],["New Non-PO: one-time vendor","New Non-PO","New one-time vendor, invoice attached, TIN/Address/Banking-Check. W9 Validated. Payment Terms checked."],["New PO: onsite","New PO","New PO supplier (on-site). ISN, COI and safety reviewed. Scope present. TIN/Address/Banking-Check. W9 Validated. BP created, ANID and TRR confirmed."],["Supplier update","Supplier Update","Supplier update reviewed. W-9, payment instructions and invoice agree. FBL1N/ME2N checked, no open activity. Update processed."]],"rules":"Rules (Vendor Management Analyst):\n- Daily goal: 3 completed registrations per person per business day. A registration counts when a supplier open in one daily snapshot is registered in the next; uploads before noon Arizona time credit the previous business day; weekends skipped.\n- Priority: Pending Approval, Pending Resubmit, In Registration, Invited. Aging: Invited >14d reminder, >30d escalate; In Registration >30d escalate; Pending Resubmit >14d reminder, >30d escalate; Pending Approval >10 business days internal review; missing contact: recipient needed; missing form assignment: Forms Review Queue; missing file data: review required.\n- Review order: ISNet first, then Tax, Banking, Code of Conduct/ESG, Insurance, Safety, Scope, BP, Ariba enablement, audit evidence, approval, comment. No Scope = No Approval.\n- ISNet: if supplier answers YES, ISNet is the source of truth for insurance and safety (dashboard shows Covered by ISNet) but the Ariba COI and Safety questionnaires are still worked. Missing Company ID: send the ISNet follow-up first, before insurance/safety review or rejection.\n- Tax: W-9 current, signed, dated, legal name on Line 1, TINCheck with Line 1 name + TIN (never DBA). Name/TIN mismatch or DBA on Line 1: request corrected W-9. ITIN: AP Leadership. Disregarded entity: owner name. Foreign: W-8 workflow (Canada: CRA number, FATCA, treaty, LOB, Line 15; no U.S. EIN solely for being Canadian; treaty questions to Tax/AP Leadership); IBAN validation for international banking.\n- Banking: Non-PO AVS in Clearway01 (address blank); PO Penny Test in Clearway03 (save Request ID in Tracking Log, Form Notes, Audit Form); failed Penny: Challenge Test in Clearway02; callback only for delayed business-critical PO suppliers and the Penny Test is still completed later. Failed Challenge Test or fraud signs (Gmail/Yahoo, spoofing, returned deposits, refused callback): Supervisor + Director immediately.\n- Insurance non-ISN: Modular Insurance Questionnaire, COI, GL, Auto, WC, limits, expiry, Additional Insured; none/expired: hold; missing AI or insufficient: return; exception: Risk Team. Safety required for onsite suppliers or >10 employees: questionnaire, OSHA 3 yrs, EMR/EMDR 3 yrs; concerns to EHS.\n- BP: company code 3505, purchasing orgs 1000-6000, USD, Incoterms, Address Valid From 01/01/1900, FLVN00 financial role (PI invoicing party), FLVN01 purchasing role (OA ordering address, no banking). Duplicate BP: Supervisor.\n- Ariba enablement: ANID, TRR sent/accepted, PO and invoice tasks, supplier roles; PO not visible: TRR, tasks, roles, 365-day filter. ANID conflict: Enablement Team; integration failure: Cognitus/ServiceNow.\n- Supplier maintenance is not a registration: compare W-9, payment instructions, invoice; run XK03/BP, FBL1N (open items: STOP, contact AP), ME2N (open POs: do not inactivate, ask the buyer which record stays active), ZMM_PROC_LIFECYCLE; only with no activity: Block Vendor, Delete Flag, Archive Flag. Confirm contact functions before changing contacts.\n- NPO audit: duplicate check in S/4 first; name/DBA; W-9/W-8; landowner contract signed, donation VP approval, one-time vendor invoice; USPS remittance address check; bank letterhead or voided check; EFT form; TIN check; Ariba form and supporting docs added to S/4. PO audit: name/DBA, scope, W-9/W-8, remittance address, invoice, banking doc, onsite ISN/COI/safety or offsite COI approvals, BP created/updated, TIN check, Ariba form and docs in S/4.\n- Every supplier needs: Worked status, meaningful comment, next owner, next action, follow-up date.","css":"/* © 2026 Aiderity Solutions LLC. All Rights Reserved. VM Command Center – Proprietary Business Application */\n/* VMA Command Center design tokens */\n:root{\n  --bg: #F6F1FF;\n  --ink: #241A45;\n  --muted: #6A608A;\n  --accent: #6A46F0;\n  --accent-2: #067A68;\n  --lavender: #B9A6FF;\n  --sky: #8FD3FF;\n  --mint: #8FF0D0;\n  --peach: #FFC6A8;\n  --pink: #FFA8D8;\n  --lemon: #FFF0A8;\n  --note: #FFF1C9;\n  --note-border: #F0A93A;\n  --ok: #D9F8EC;\n  --alert: #FFDFE9;\n  --gradient: linear-gradient(120deg,#B9A6FF,#8FD3FF 45%,#8FF0D0 75%,#FFC6A8);\n  --card: rgba(255,255,255,.62);\n  --border: rgba(124,98,230,.22);\n  --shadow: 0 12px 44px rgba(106,70,240,.16);\n  --glow: rgba(143,211,255,.7);\n  --radius-card: 22px;\n  --radius-field: 14px;\n  --radius-pill: 99px;\n  --space: 4px 8px 12px 16px 18px 24px;\n  --font-body: \"Space Grotesk\", \"Segoe UI\", system-ui, Arial, sans-serif;\n  --font-display: Orbitron, \"Space Grotesk\", sans-serif;\n}\n:root[data-theme=\"dark\"]{\n  --bg: #0C0A1F;\n  --ink: #F2EEFF;\n  --muted: #B0A6D4;\n  --accent: #C1B1FF;\n  --accent-2: #7FF5D3;\n  --note: #3D3217;\n  --note-border: #F5C76A;\n  --ok: #0F3A31;\n  --alert: #4D1A36;\n  --card: rgba(30,24,64,.58);\n  --border: rgba(190,170,255,.24);\n  --shadow: 0 12px 44px rgba(0,0,0,.5);\n  --glow: rgba(127,245,211,.55);\n}\n/* aurora blobs (light / dark): #CDBFFF / #5B45C9, #B6F5E0 / #14907B, #FFD3C0 / #B5586C, #BFE3FF / #2A72B8, #FFC4E6 / #A8439A */\n/* Google Fonts: Space Grotesk 400;600;700 and Orbitron 600;800 */\n","proc":{"np":{"docs":"Supplier form, W-9 (or W-8), EFT authorization form, bank letter or voided check, plus the type document (landowner contract, donation VP approval, or invoice).","steps":[["Duplicate check","Run the duplicate check in S/4 FIRST. A duplicate BP goes to your Supervisor."],["ISNet first","Did the supplier answer YES? Verify the Company ID. No ID: ISNet follow-up first. The dashboard shows Covered by ISNet; Ariba COI and Safety questionnaires are still worked if they apply."],["Name and DBA","Legal name and DBA agree across the form, W-9/W-8 and supporting document. Only the Line 1 legal name goes into TINCheck."],["Tax: W-9 / W-8","W-9 current, signed, dated; TINCheck passed. Foreign: W-8 workflow. See the W-8 / W-9 tab."],["Type document","Landowner: contract available and signed. Donation / contribution: VP approval provided. One-time vendor and other: invoice."],["Remittance address","Check the remittance address on the USPS address lookup site window.dashTop=()=>{const L=SUP.list.filter(s=>s.group).sort((a,b)=>(a.group>b.group?1:-1)||(b.days||0)-(a.days||0)).slice(0,3);return L.length?'<div class="sub">From the dashboard:</div><ol>'+L.map(s=>'<li><b>'+esc(s.name)+'</b> · '+esc(s.st)+': '+esc(s.next)+'</li>').join('')+'</ol>':''};
window.dashSup=()=>SUP.list;window.dashWeek=()=>{if(!SUP.list.length)return[];const[a,b]=[weekStart(azDate()),azDate()],ds=dates().filter(d=>d>=a&&d<=b),c=ds.reduce((n,d)=>n+((completions(d)||[]).length),0),L=SUP.list;return['Onboarding dashboard (week to date, report '+shortD(DV.asOf)+'): '+c+' registrations completed across all owners; Pending Approval '+L.filter(s=>s.st==='Pending Approval').length+'; closest to completion '+L.filter(s=>s.group).length+'; ISNet follow-up '+L.filter(SIG.isnf[1]).length+'; no update over 30 days '+L.filter(SIG.a30[1]).length]};
function dDlg(i){const s=SUP.all[i];if(!s)return;const h='<div class="row" style="margin:0;justify-content:space-between;align-items:center"><h3 style="margin:0">'+esc(s.name)+'</h3><button class="btn" id="ddclose">Close</button></div><div class="sub">'+esc([s.id,s.bp].filter(Boolean).join(' · '))+'</div><div class="wib"><div><small>Status</small>'+esc(s.st)+'</div><div><small>Owner</small>'+esc(s.owner)+'</div><div><small>Last update</small>'+(s.last?shortD(s.last)+' ('+s.days+' days)':'—')+'</div><div><small>ISNet</small>'+esc(s.isn)+(s.q.isnId?' · '+esc(s.q.isnId):'')+'</div><div><small>COI</small>'+esc(s.coi)+(s.isnYes&&s.ins.coi?' (Ariba: '+esc(s.ins.coi)+')':'')+'</div><div><small>Safety</small>'+esc(s.saf)+(s.isnYes&&s.ins.saf?' (Ariba: '+esc(s.ins.saf)+')':'')+'</div><div><small>Scope</small>'+esc(s.q.scope||'—')+'</div><div><small>Contact</small>'+esc(s.q.contact||'—')+'</div><div><small>PO/PR lifecycle</small>'+(s.zm?s.zm.rows+' rows · '+s.zm.po+' PO · '+s.zm.pr+' PR':'—')+'</div><div><small>Other reports</small>'+esc(s.oth.join(', ')||'—')+'</div></div><div class="res'+(s.open.length?' bad':'')+'"><b>Open items:</b> '+esc(s.open.join('; ')||'None')+'<br><b>Next step:</b> '+esc(s.next)+'</div><div class="row"><button class="btn go" data-wl="'+i+'">Add to worklist</button><button class="btn" data-an="'+i+'">Open in Scenario Analyzer</button><button class="btn" data-cs="'+i+'">Copy summary</button></div>';$('#dd').querySelector('.dlg2').innerHTML=h;$('#dd').hidden=false;window.dLast=document.activeElement;$('#ddclose').focus()}
function dWl(s){const kind=/non/i.test(s.q.po||'')?'Non-PO':/po/i.test(s.q.po||'')?'PO':'Other';W.items.push({id:uid(),sup:s.name,bp:s.bp||s.id||'',kind:kind,status:INFL.includes(s.st)?s.st:'In Registration',since:s.last||azDate(),fu:nextBiz(azDate()),own:s.group==='g1'?'Vendor Management':s.group==='g2'?'Safety':'Supplier',wb:ME(),tf:'',bl:s.open.join('; ').slice(0,200),na:s.next.slice(0,200),u:Date.now()})}
function autoLog(){const ds=dates(),cut=addDays(azDate(),-35);let n=0;ds.forEach((d,i)=>{if(i<1)return;const cr=DB.snaps[d].credit||d;if(cr<cut)return;(completions(d)||[]).forEach(r=>{if(normOwner(r.owner)!==MEN)return;const key='rpt:'+d+':'+(r.id||norm(r.name));if(G.items.some(x=>x.id===key)||(G.del||[]).includes(key))return;const nm=norm(r.name),w=weekStart(cr);if(G.items.some(x=>((x.bp&&r.bp&&String(x.bp)===String(r.bp))||norm(x.sup)===nm)&&weekStart(x.credit)===w))return;G.items.push({id:key,sup:r.name,bp:r.bp||'',kind:/non/i.test(r.type||'')?'Non-PO':'Other',credit:cr,ts:Date.now(),note:'From uploaded report '+shortD(d),wb:MEN,tf:'',src:'report'});n++})});if(n){gsv();toast(n+' completed registration(s) added to your goal tracker from the reports')}}

function dFilterGo(f){DFL=Object.assign({},f);DLIM=100;dGo('dt')}
document.addEventListener('click',async e=>{const t=e.target,b=t.closest('button');if(!b)return;const inDash=b.closest('#p-dash,#dsc,#dd,.pc');if(!inDash&&!b.id)return;
 if(b.dataset.f){try{dFilterGo(JSON.parse(b.dataset.f))}catch(x){}if($('#p-dash').classList.contains('on')===false)show('dash');return}
 if(b.dataset.ds){DV.sec=b.dataset.ds;dRender();return}
 if(b.dataset.sup!==undefined){dDlg(+b.dataset.sup);return}
 if(b.dataset.wl!==undefined){const s=SUP.all[+b.dataset.wl];if(s){dWl(s);wsv();toast('Added to worklist: '+s.name)}return}
 if(b.dataset.wlg){const M=SUP.list.filter(s=>s.group===b.dataset.wlg);M.forEach(dWl);wsv();toast(M.length+' added to worklist');return}
 if(b.dataset.asof){DV.asOf=b.dataset.asof;dRender();return}
 if(b.dataset.drop){if(b.dataset.arm){delete DB.snaps[b.dataset.drop];dsv();DV.asOf='';dRender();dSnap()}else{b.dataset.arm='1';b.textContent='Confirm';setTimeout(()=>{b.dataset.arm='';b.textContent='Remove'},3000)}return}
 if(b.dataset.an!==undefined){const s=SUP.all[+b.dataset.an];$('#dd').hidden=true;show('scen');$('#sn').value=s.name;$('#sb').value=s.bp||s.id||'';if(['Pending Approval','Pending Resubmit','In Registration','Invited'].includes(s.st))$('#ss').value=s.st;$('#si').value=s.isnYes?(s.isnId?'YES, Company ID provided':'YES, no Company ID'):s.isn==='No'?'NO':'Not yet known';$('#sd').value=s.days==null?'':s.days;$('#sx').value=s.open.join('; ');$('#run').click();return}
 if(b.dataset.cs!==undefined){const s=SUP.all[+b.dataset.cs];toast((await copyText(s.name+' ('+[s.id,s.bp].filter(Boolean).join(' · ')+')\nOwner: '+s.owner+'\nStatus: '+s.st+' ('+(s.days==null?'no date':s.days+' days since update')+')\nISNet: '+s.isn+' · COI: '+s.coi+' · Safety: '+s.saf+'\nOpen items: '+(s.open.join('; ')||'none')+'\nNext step: '+s.next))?'Summary copied':'Copy blocked');return}
 if(b.dataset.sort){const k=b.dataset.sort;DSORT=DSORT.k===k?{k,d:-DSORT.d}:{k,d:k==='days'?-1:1};dTable();return}
 if(b.dataset.rm){delete DFL[b.dataset.rm];dDt();return}
 if(b.id==='dup'){DV.sec='fl';dRender();setTimeout(()=>{const f=$('#dfile');if(f)f.click()},50);return}
 if(b.id==='dsco'){dGo('ov');show('dash');return}if(b.id==='dsup'){show('dash');DV.sec='fl';dRender();return}
 if(b.id==='ddclose'){$('#dd').hidden=true;if(window.dLast)window.dLast.focus();return}
 if(b.id==='dclose2'){DFL=DFL.group==='close'?{}:{group:'close'};dDt();return}if(b.id==='dclear'){DFL={};dDt();return}
 if(b.id==='dmore'){DLIM+=200;dTable();return}if(b.id==='dcx'){toast((await copyText(dExp('\t')))?'Copied: paste into Excel':'Copy blocked');return}
 if(b.id==='dcsv'){try{const dn=await claude.use('downloads');if(!dn)throw 0;await dn.save({filename:'supplier-detail.csv',data:dExp(',')});toast('Saved')}catch(x){toast((await copyText(dExp(',')))?'Download unavailable: CSV copied':'Download unavailable')}return}
 if(b.id==='dload'){dLoad();return}if(b.dataset.up){FORCE=b.dataset.up;const f=$('#dfile1');f.multiple=FORCE==='other';f.click();return}
 if(b.id==='dtpl'){const T=Object.keys(FLD).map(k=>TYPES[k]+':\n'+FLD[k].map(f=>f[2][0]).join(',')).join('\n\n');try{const dn=await claude.use('downloads');if(!dn)throw 0;await dn.save({filename:'sample-report-headers.txt',data:T});toast('Saved')}catch(x){toast((await copyText(T))?'Headers copied':'Copy blocked')}return}
 if(b.id==='dbk'){toast((await copyText(JSON.stringify(DB)))?'Backup copied':'Copy blocked');return}
 if(b.id==='dclr'){if(b.dataset.arm){DB={snaps:{},map:{}};dsv();DV.asOf='';dRender();dSnap()}else{b.dataset.arm='1';b.textContent='Tap again to clear all';setTimeout(()=>{b.dataset.arm='';b.textContent='Clear all data'},3000)}}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='dq'){DFL.q=t.value;DLIM=100;dTable()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='dfile'){dAddFiles([...t.files]);t.value=''}else if(t.id==='dfile1'){dAddFiles([...t.files],FORCE);t.value=''}else if(t.id==='rdd'){DV.rdy=t.value;dFl()}else if(t.id==='dsc2'){DV.scope=t.value;LS.s('vma_dscope',DV.scope);dRender();wall()}
 else if(t.id==='drd'){DV.asOf=t.value;dRender()}else if(t.id==='dpr'){DV.per=t.value;dRender()}else if(t.id==='dfr'||t.id==='dto'){DV.from=$('#dfr').value;DV.to=$('#dto').value;dRender()}
 else if(t.dataset&&t.dataset.cr){DB.snaps[t.dataset.cr].credit=t.value;dsv();dRp()}
 else if(t.dataset&&t.dataset.pt!==undefined){const p=PEND[+t.dataset.pt];p.type=t.value;if(p.type!=='skip')p.map=autoMap(p.type==='other'?'link':p.type,p.hdr);dPend()}else if(t.dataset&&t.dataset.pd!==undefined)PEND[+t.dataset.pd].date=t.value;
 else if(t.dataset&&t.dataset.pm){const[i,f]=t.dataset.pm.split('|');PEND[+i].map[f]=+t.value}
 else if(['dfs','dfo','dfi','dfc','dff','dfb'].includes(t.id)){const k={dfs:'status',dfo:'owner',dfi:'isn',dfc:'coi',dff:'saf',dfb:'bucket'}[t.id];DFL[k]=t.value;DLIM=100;dTable();$('#dclose2')&&($('#dclose2').classList.toggle('go',DFL.group==='close'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dd').hidden){$('#dd').hidden=true;if(window.dLast)window.dLast.focus()}});
const _s6=show;show=function(t){_s6(t);if(t==='dash'){dRender()}};
